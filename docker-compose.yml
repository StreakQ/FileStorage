services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app_network

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - app_network

  web:
    build: .
    ports:
      - "8080:8000"
    environment:
      DB_HOST: db
      MINIO_ENDPOINT_URL: http://minio:9000
    depends_on:
      - db
      - minio
      - redis
    volumes:
      - static_volume:/app/staticfiles
    networks:
      - app_network
    restart: unless-stopped

  worker:
    build: .
    command: celery -A FileStorage worker --loglevel=info
    environment:
      DB_HOST: db
      MINIO_ENDPOINT_URL: http://minio:9000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - minio
      - redis
    networks:
      app_network:
    restart: unless-stopped

volumes:
  mysql_data:
  minio_data:
  static_volume:

networks:
  app_network:
    driver: bridge