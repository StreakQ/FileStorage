# docker-compose.yml
version: '3.8' # Указывает версию формата файла

services: # Определяем список сервисов
  db: # Имя сервиса (произвольное, но часто отражает тип)
    image: mysql:8.0 # Образ для контейнера
    environment: # Переменные окружения для MySQL
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # Использует переменные из .env файла
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes: # Монтируем том для постоянного хранения данных MySQL
      - mysql_data:/var/lib/mysql
    networks: # Подключаем к сети
      - app_network

  minio: # Имя сервиса
    image: minio/minio:latest
    command: server /data --console-address ":9001" # Команда для запуска внутри контейнера
    environment: # Переменные для MinIO
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: # Публикуем порты на хост
      - "9000:9000"
      - "9001:9001"
    volumes: # Том для данных MinIO
      - minio_data:/data
    networks: # Подключаем к сети
      - app_network

  web: # Имя сервиса для Django
    build: . # Собираем образ из текущей директории (где Dockerfile)
    # image: filestorage:latest # Альтернатива: использовать готовый образ
    ports: # Публикуем порт Django-приложения
      - "8080:8000"
    environment: # Переменные для Django
      # ... DB_HOST, MINIO_ENDPOINT_URL, REDIS_HOST и т.д. ...
      DB_HOST: db
      MINIO_ENDPOINT_URL: http://minio:9000
    depends_on: # Указывает зависимости (web ждёт запуска db, minio)
      - db
      - minio
    volumes: # Монтируем статику (опционально)
      - static_volume:/app/staticfiles
    networks: # Подключаем к сети
      - app_network
    restart: unless-stopped # Перезапускать при сбоях

volumes: # Определяем именованные тома
  mysql_data:
  minio_data:
  static_volume:

networks: # Определяем сеть
  app_network:
    driver: bridge # Стандартный драйвер